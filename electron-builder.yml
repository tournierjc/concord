# Configuration electron-builder — Concord
#
# Contraintes dures (SPEC-001 A15 / CA19 / CA20) :
#   - publish: null  => aucun provider de publication, donc AUCUN fichier de mise à jour généré
#                       (pas de latest-linux.yml / latest.yml) et aucune dépendance electron-updater.
#   - aucune signature obligatoire, aucun notarize, aucun service distant.
#   - pas de `afterSign`, pas de `publish` par cible.
# Cibles : Linux x64 (AppImage + deb), Windows x64 (nsis).
#
# Note pour Régie : ce fichier est la SEULE source de config d'electron-builder.
# Le champ "build" de package.json a été supprimé (AD-28) : read-config-file lit
# package.json["build"] EN PRIORITÉ et n'ouvre ce fichier que si ce champ est absent.

appId: local.concord.app
productName: Concord
artifactName: concord-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# Rien d'autre que le code compilé + le manifeste.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.md'
  - '!**/{.git,.github,test,tests,SPECS,src,.vscode}/**'

asar: true
compression: normal

# Aucune mise à jour automatique, aucun canal de publication.
publish: null
generateUpdatesFilesForAllChannels: false

electronLanguages:
  - fr
  - en-US

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  synopsis: Chat vocal sur réseau local, sans compte et sans cloud
  description: >-
    Salon vocal pour un groupe sur le même réseau local. Aucune donnée ne quitte le LAN : pas de
    compte, pas de télémétrie, pas de mise à jour automatique.
  desktop:
    entry:
      Name: Concord
      Comment: Chat vocal sur réseau local
      Categories: AudioVideo;Network;
      StartupWMClass: concord
  executableName: concord
  maintainer: Concord <maintainers@concord.local>

deb:
  # Dépendances de runtime standard d'Electron sous Debian/Ubuntu. Aucune dépendance réseau.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends: []

appImage:
  # appImage.license embarquait « LICENCE », fichier ABSENT du dépôt : toute
  # construction AppImage échouait (VERIF 029, 2026-10-31). L'option est retirée
  # pour que la cible reste constructible.
  # 2026-10-31 (arbitrage JC) : le dépôt est sous licence MIT, fichier LICENSE
  # présent à la racine ; package.json "license": "MIT" est donc exact. Rien à
  # embarquer de force : l'option reste absente, le fichier est versionné.
  artifactName: concord-${version}-${arch}.AppImage

win:
  target:
    - target: nsis
      arch: [x64]
  # AUCUN certificat Windows (arbitrage JC, 2026-10-31) : les binaires Windows
  # sont livrés NON SIGNÉS. La construction ne doit pas échouer faute de
  # certificat ; SmartScreen affichera un avertissement, c'est assumé et dit.
  forceCodeSigning: false
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false
  executableName: concord

nsis:
  # makensis 3.11 du système (build Linux sans wine, 2026-11-01) émet des avertissements
  # sur le gabarit d'electron-builder 24 ; ils ne doivent pas faire échouer le build.
  warningsAsErrors: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
  deleteAppDataOnUninstall: false
  shortcutName: Concord
  artifactName: concord-${version}-setup-${arch}.${ext}
